name: selftest

# Run the engine self-test on every push / PR. selftest.ps1 is the gate (it must exit 0):
# it parses + ASCII-checks every .ps1, scaffolds into a throwaway hub, drives the terminal with a
# stub `claude`, fuzzes the registry parser, and more.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run engine selftest (Windows PowerShell 5.1)
        shell: powershell
        run: .\tools\selftest.ps1
