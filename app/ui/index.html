<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sonelle</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <!-- title bar = window drag handle. WebView2 ignores -webkit-app-region (Electron-only), so the
         move uses pywebview's '.pywebview-drag-region'; app.js cancels the drag over '.nodrag' controls. -->
    <header id="titlebar" class="pywebview-drag-region">
      <div class="brand nodrag">
        <!-- the app icon (sound wave) - keep in sync with assets\icon\sonelle.svg -->
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
          <rect x="2" y="2" width="96" height="96" rx="22" fill="#241A33"/>
          <path d="M20 50 q7.5 -18 15 0 t15 0 t15 0 t15 0" fill="none" stroke="#FF9B85" stroke-width="7" stroke-linecap="round"/>
        </svg>
        <span class="word">sonelle</span>
      </div>
      <div id="tabs" class="tabs nodrag"></div>
      <button id="btn-new" class="nodrag iconbtn" title="new terminal (Ctrl+T)" aria-label="new terminal">+</button>
      <div class="spacer"></div>
      <div class="wctrls nodrag">
        <button id="btn-min" class="wbtn" title="minimize" aria-label="minimize"><span class="g-min"></span></button>
        <button id="btn-max" class="wbtn" title="maximize" aria-label="maximize"><span class="g-max"></span></button>
        <button id="btn-close" class="wbtn close" title="close" aria-label="close"><span class="g-close"></span></button>
      </div>
    </header>

    <!-- terminal panes (output only - typing is disabled here; the composer below is the input) -->
    <main id="stack"></main>

    <!-- shown only when no tabs are open -->
    <section id="welcome" class="welcome glass" hidden>
      <!-- the app icon (sound wave) - keep in sync with assets\icon\sonelle.svg -->
      <svg class="w-mark" viewBox="0 0 100 100" aria-hidden="true">
        <rect x="2" y="2" width="96" height="96" rx="22" fill="#241A33"/>
        <path d="M20 50 q7.5 -18 15 0 t15 0 t15 0 t15 0" fill="none" stroke="#FF9B85" stroke-width="7" stroke-linecap="round"/>
      </svg>
      <button id="w-open" class="primary nodrag">open a terminal</button>
    </section>

    <!-- the ONE place you type; it forwards to the terminal running behind the scenes -->
    <footer id="bar">
      <div class="cmdbar glass">
        <span class="prompt" aria-hidden="true"></span>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="ask a project to do something">
        <button id="send" class="send" title="send" aria-label="send"><span class="g-send"></span></button>
      </div>
    </footer>
  </div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script src="names.js"></script>
  <script src="app.js"></script>
</body>
</html>
